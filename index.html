<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HeWiki">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181b" media="(prefers-color-scheme: dark)">
<title>Hebrew Wikipedia Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one reading column; a thin coverage strip under the title compares the Hebrew and English articles. */
:root{
  --bg:#f6f7f4; --paper:#fdfdfb; --fg:#1c2024; --muted:#5d6670; --rule:#d9ddd6;
  --accent:#0b5aa0; --accent-ink:#ffffff; --he:#8a5a00; --he-bg:#fbf3df;
  --only:#8b2f1a; --only-bg:#f9e7e1; --bar-he:#c98a1a; --bar-en:#0b5aa0;
  --f-ui:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-he:"Frank Ruhl Libre","David",Georgia,serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --fs:1.05rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181b; --paper:#1c2024; --fg:#e6e8e3; --muted:#9aa3ab; --rule:#2e343a;
    --accent:#6fb0ee; --accent-ink:#0f1a26; --he:#e2b35a; --he-bg:#2a2416;
    --only:#f0a08a; --only-bg:#33201b; --bar-he:#e2b35a; --bar-en:#6fb0ee; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181b; --paper:#1c2024; --fg:#e6e8e3; --muted:#9aa3ab; --rule:#2e343a;
  --accent:#6fb0ee; --accent-ink:#0f1a26; --he:#e2b35a; --he-bg:#2a2416;
  --only:#f0a08a; --only-bg:#33201b; --bar-he:#e2b35a; --bar-en:#6fb0ee; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 var(--fs)/1.55 var(--f-en);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font-family:var(--f-ui);font-size:1rem;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--rule);border-radius:999px;padding:.35rem .8rem;line-height:1.2}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
a{color:var(--accent)}
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.hdr-in{max-width:46rem;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:.6rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.brand{font:700 1.15rem/1 var(--f-he);letter-spacing:.01em;white-space:nowrap;text-decoration:none;color:var(--fg)}
.brand small{font:500 .7rem var(--f-ui);color:var(--muted);display:block;margin-top:.2rem;letter-spacing:.08em;text-transform:uppercase}
.search{flex:1 1 14rem;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:.5rem 2.4rem .5rem 1rem;font-size:1rem}
.search .clear{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);border:0;padding:.2rem .5rem;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + .4rem);background:var(--paper);border:1px solid var(--rule);border-radius:.8rem;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:70vh;overflow:auto;z-index:6}
.results:empty{display:none}
.res{display:grid;grid-template-columns:3rem 1fr;gap:.7rem;padding:.6rem .8rem;border-bottom:1px solid var(--rule);cursor:pointer;align-items:center}
.res:last-child{border-bottom:0}
.res:hover,.res:focus{background:var(--bg)}
.res img,.res .noimg{width:3rem;height:3rem;object-fit:cover;border-radius:.4rem;background:var(--rule)}
.res .t{font-family:var(--f-ui);font-weight:500;line-height:1.25}
.res .he{font-family:var(--f-he);color:var(--muted);direction:rtl;text-align:right;font-size:.95rem}
.res .d{font-size:.8rem;color:var(--muted);font-family:var(--f-ui)}
.res.note{display:block;color:var(--muted);font-family:var(--f-ui);font-size:.85rem;cursor:default}
.tools{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tools .sep{width:1px;height:1.4rem;background:var(--rule)}
.prog{height:2px;background:transparent;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0;transition:width .25s}
main{max-width:46rem;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:1rem 4rem}
.home h1{font:500 1.9rem/1.15 var(--f-he);margin:.6rem 0 .3rem;text-wrap:balance}
.home p{color:var(--muted);font-family:var(--f-ui);max-width:34rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.8rem 0 1.4rem}
.chips button{font-family:var(--f-he);font-size:1.05rem;direction:rtl}
.recent h2,.cmp h2{font:600 .75rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1.2rem 0 .5rem}
.recent ul{list-style:none;padding:0;margin:0;display:grid;gap:.3rem}
.recent a{display:flex;justify-content:space-between;gap:1rem;text-decoration:none;color:var(--fg);padding:.5rem .7rem;border:1px solid var(--rule);border-radius:.6rem;font-family:var(--f-ui)}
.recent a span:last-child{font-family:var(--f-he);color:var(--muted);direction:rtl}
.banner{background:var(--only-bg);color:var(--only);border-radius:.6rem;padding:.6rem .9rem;font-family:var(--f-ui);font-size:.9rem;margin:.6rem 0}
.banner.ok{background:var(--he-bg);color:var(--he)}
/* article head */
.ah{margin:.4rem 0 1rem;border-bottom:1px solid var(--rule);padding-bottom:.8rem}
.ah h1{font:600 2rem/1.15 var(--f-en);margin:.2rem 0;text-wrap:balance}
.ah .he-title{font:500 1.35rem/1.2 var(--f-he);direction:rtl;text-align:right;color:var(--he);margin:0 0 .6rem}
.cov{display:grid;grid-template-columns:auto 1fr auto;gap:.3rem .7rem;align-items:center;font:500 .8rem/1.3 var(--f-ui);color:var(--muted);margin:.6rem 0}
.cov .bar{height:.5rem;background:var(--rule);border-radius:999px;overflow:hidden;min-width:0}
.cov .bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .4s}
.cov .bar.he i{background:var(--bar-he)} .cov .bar.en i{background:var(--bar-en)}
.cov b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
.cov .lab{font-family:var(--f-ui)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.6rem;font-family:var(--f-ui);font-size:.85rem}
.chip{display:inline-block;border-radius:999px;padding:.2rem .6rem;font-weight:500;font-size:.8rem}
.chip.only{background:var(--only-bg);color:var(--only)}
.chip.he{background:var(--he-bg);color:var(--he)}
.modes{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.modes button{border:0;border-radius:0;padding:.35rem .75rem;font-size:.85rem}
.modes button+button{border-left:1px solid var(--rule)}
.status{font-family:var(--f-ui);font-size:.8rem;color:var(--muted);margin-left:auto}
/* comparison panel */
.cmp{display:none;border:1px solid var(--rule);border-radius:.8rem;padding:.8rem 1rem;margin:.6rem 0 1rem;background:var(--paper)}
.cmp.open{display:block}
.cmp .cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:560px){.cmp .cols{grid-template-columns:1fr}}
.cmp h3{font:600 .85rem var(--f-ui);margin:.2rem 0 .5rem;display:flex;justify-content:space-between;gap:.5rem}
.cmp h3 span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.cmp ol{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;font-family:var(--f-ui);font-size:.82rem}
.cmp li{display:grid;grid-template-columns:1fr 5rem;gap:.5rem;align-items:center;min-width:0}
.cmp li.l3{padding-left:.9rem;color:var(--muted)}
.cmp li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp li .n small{color:var(--muted);font-family:var(--f-he);direction:rtl;unicode-bidi:isolate;margin-left:.3rem}
.cmp li .b{height:.4rem;background:var(--rule);border-radius:999px;overflow:hidden}
.cmp li .b i{display:block;height:100%}
.cmp .he li .b i{background:var(--bar-he)} .cmp .en li .b i{background:var(--bar-en)}
.cmp .empty{color:var(--muted);font-family:var(--f-ui);font-size:.85rem}
/* article body */
.body{font-size:var(--fs)}
.body[data-mode="he"]{direction:rtl;text-align:right;font-family:var(--f-he)}
.body .t-en{display:block;direction:ltr;text-align:left;unicode-bidi:isolate;font-family:var(--f-en)}
.body .t-he{display:block;direction:rtl;text-align:right;unicode-bidi:isolate;font-family:var(--f-he)}
.body[data-mode="en"] .t-he{display:none}
.body[data-mode="he"] .t-en{display:none}
.body[data-mode="both"] .t-he{color:var(--he);font-size:.94em;margin-top:.25em;padding-right:.6rem;border-right:2px solid var(--he-bg)}
.body[data-mode="en"] .blk.show .t-he{display:block;color:var(--he);font-size:.94em;margin-top:.3em;padding:.4rem .6rem;background:var(--he-bg);border-radius:.4rem}
.body .blk.pending .t-en{color:var(--muted)}
.body[data-mode="en"] .blk{cursor:pointer}
.body h2,.body h3,.body h4{font-family:var(--f-en);line-height:1.2;margin:1.6em 0 .5em;text-wrap:balance}
.body h2{font-size:1.45em;font-weight:600;border-bottom:1px solid var(--rule);padding-bottom:.2em}
.body h3{font-size:1.15em;font-weight:600}.body h4{font-size:1em;font-weight:600}
.body h2 .t-he,.body h3 .t-he{font-weight:500}
.body p{margin:0 0 1em}
.body img{max-width:100%;height:auto}
.body figure,.body .thumb,.body .tmulti{margin:1em 0;max-width:100%}
.body figure{display:block}
.body figcaption,.body .thumbcaption{font:400 .85rem/1.4 var(--f-ui);color:var(--muted);margin-top:.3rem}
.body table{border-collapse:collapse;max-width:100%;font-size:.9em}
.body .tbl{overflow-x:auto;margin:1em 0}
.body td,.body th{padding:.25rem .5rem;vertical-align:top;border:1px solid var(--rule)}
.body th{background:var(--paper)}
.body .infobox,.body table.infobox{float:none;width:100%!important;max-width:100%;margin:0 0 1.2rem;background:var(--paper);font-size:.88em}
@media (min-width:760px){.body[data-mode="en"] .infobox,.body[data-mode="both"] .infobox{float:right;width:22rem!important;margin:0 0 1rem 1.2rem}.body[data-mode="he"] .infobox{float:left;width:22rem!important;margin:0 1.2rem 1rem 0}}
.body .infobox img{max-width:100%;height:auto}
.body .infobox th,.body .infobox td{border:0;border-bottom:1px solid var(--rule)}
.body sup.reference{font-size:.7em;color:var(--muted)}
.body .reflist,.body ol.references{font-size:.85em;color:var(--muted);direction:rtl;text-align:right;font-family:var(--f-he)}
.body .hatnote{font-size:.9em;color:var(--muted);font-style:italic;margin:0 0 1em}
.body ul,.body ol{padding-inline-start:1.4em}
.body[data-mode="he"] ul,.body[data-mode="he"] ol{padding-inline-start:1.4em}
.body .mw-empty-elt,.body .navbox,.body .metadata,.body .ambox,.body .noprint,.body .mw-editsection,.body .sistersitebox,.body .portal,.body .catlinks,.body #toc,.body .toc,.body .mw-jump-link,.body .ambox-content{display:none!important}
.body .collapse{margin:1em 0}
.body details summary{cursor:pointer;font-family:var(--f-ui);font-weight:500;color:var(--muted)}
.foot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--rule);font:400 .8rem/1.5 var(--f-ui);color:var(--muted)}
.skel{height:1em;background:var(--rule);border-radius:.3em;margin:.5em 0;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fsz{display:inline-flex;gap:.2rem}
.fsz button{padding:.3rem .6rem;font-family:var(--f-en)}

.settings-back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:1rem}
@media (min-width:640px){.settings-back{align-items:center}}
.settings{background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:1rem;padding:1.1rem 1.2rem;width:min(30rem,100%);max-height:90vh;overflow:auto;font-family:var(--f-ui);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.settings h2{margin:0 0 .3rem;font:600 1.1rem var(--f-ui)}
.settings p{margin:0 0 .8rem;color:var(--muted);font-size:.85rem}
.settings .f{display:grid;gap:.25rem;margin:.7rem 0;font-size:.85rem}
.settings .f span{font-weight:500}
.settings .f input{width:100%;border:1px solid var(--rule);border-radius:.5rem;padding:.45rem .6rem;background:var(--bg);font:1rem var(--f-ui)}
.settings .f small{color:var(--muted)}
.settings .c{display:flex;gap:.4rem;align-items:center;font-size:.85rem;margin:.5rem 0}
.settings .row{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;margin-top:1rem}
.pstatus{list-style:none;margin:0 0 .6rem;padding:.5rem .7rem;border:1px solid var(--rule);border-radius:.6rem;font-size:.82rem;display:grid;gap:.2rem}
.pstatus li{display:flex;justify-content:space-between;gap:1rem}
.pstatus .ok{color:var(--accent)} .pstatus .bad{color:var(--muted)}

.offline{display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:1.4rem;padding-top:.8rem;border-top:1px solid var(--rule);font:400 .8rem/1.5 var(--f-ui);color:var(--muted)}
.offline button{font-size:.8rem;padding:.25rem .7rem}
.tag{display:inline-block;margin-left:.5rem;font:500 .65rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 .4rem;vertical-align:middle}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="#" id="brand">ויקיפדיה<small>Hebrew · in English</small></a>
    <div class="search">
      <input id="q" type="search" placeholder="Search Hebrew Wikipedia (English or עברית)" autocomplete="off" dir="auto" aria-label="Search Hebrew Wikipedia">
      <button class="clear" id="clear" aria-label="Clear search" hidden>×</button>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div class="tools">
      <button id="rnd" title="Random Hebrew article">Random</button>
      <button id="rndonly" title="A random article that exists only in Hebrew">Hebrew-only</button>
      <span class="sep"></span>
      <button id="settings" title="Translation settings" aria-label="Translation settings">Translators</button>
      <span class="fsz"><button id="fsm" aria-label="Smaller text">A−</button><button id="fsp" aria-label="Larger text">A+</button></span>
    </div>
  </div>
  <div class="prog"><i id="prog"></i></div>
</header>

<main id="main"></main>

<script>
(() => {
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v!==false && v!=null) e.setAttribute(k, v); } for (const k of kids) if (k!=null) e.append(k); return e; };
const HEB = /[א-ת]/;
const fmtK = n => n==null ? '—' : n >= 1000 ? (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k' : String(n);
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{return d;} }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };

/* ---------- Wikipedia API ---------- */
// Every call gets action=query unless the caller says otherwise: without an action MediaWiki serves its HTML help page
// with status 200, whatever `format` says. If a host answers with HTML anyway, the other host is tried once.
const MOBILE = /Mobi|iPhone|iPad|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const apiQS = (params) => { const qs = new URLSearchParams(); Object.entries({action:'query', format:'json', formatversion:2, origin:'*', ...params}).forEach(([k,v]) => qs.set(k, v)); return qs; };
const apiKey = (lang, params) => lang + '|' + apiQS(params);
async function api(lang, params) {
  // Page-shaped calls (parse, info, langlinks, sections) are kept for offline reading; searches and random draws are not.
  const cacheable = !params.generator && !params.list && params.action !== 'opensearch';
  return cacheable ? cachedFetchJSON(apiKey(lang, params), () => apiFetch(lang, params)) : apiFetch(lang, params);
}
async function apiFetch(lang, params) {
  const qs = apiQS(params);
  const hosts = [`${lang}.wikipedia.org`, `${lang}.m.wikipedia.org`]; // the m. host just redirects to the main one for api.php
  const errs = [];
  for (const host of hosts) {
    try {
      const r = await fetch(`https://${host}/w/api.php?${qs}`);
      const raw = await r.text();
      if (r.ok) { try { return JSON.parse(raw); } catch {} }
      errs.push(`${host}${r.redirected ? ' → '+r.url : ''}: HTTP ${r.status} ${r.headers.get('content-type')||''} ${raw.slice(0,80).replace(/\s+/g,' ')}`);
    } catch (e) { errs.push(`${host}: ${e.name||''} ${e.message||e}`); }
  }
  throw new Error(`Wikipedia ${lang} unreachable — ` + errs.join(' | '));
}

/* ---------- #debug: probe every host this page depends on and show what each answers ---------- */
async function renderDebug() {
  loadToken++;
  const probes = [
    ['he.wikipedia.org api', 'https://he.wikipedia.org/w/api.php?action=query&meta=siteinfo&siprop=general&format=json&formatversion=2&origin=*'],
    ['he.m.wikipedia.org api', 'https://he.m.wikipedia.org/w/api.php?action=query&meta=siteinfo&siprop=general&format=json&formatversion=2&origin=*'],
    ['en.wikipedia.org api', 'https://en.wikipedia.org/w/api.php?action=query&meta=siteinfo&siprop=general&format=json&formatversion=2&origin=*'],
    ['he.wikipedia.org REST summary', 'https://he.wikipedia.org/api/rest_v1/page/summary/%D7%AA%D7%9C_%D7%90%D7%91%D7%99%D7%91'],
    ['he.wikipedia.org REST search', 'https://he.wikipedia.org/w/rest.php/v1/search/title?q=%D7%AA%D7%9C&limit=2'],
    ['he.m.wikipedia.org REST search', 'https://he.m.wikipedia.org/w/rest.php/v1/search/title?q=%D7%AA%D7%9C&limit=2'],
    ['he.wikipedia.org prefixsearch', 'https://he.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query&generator=prefixsearch&gpssearch=%D7%AA%D7%9C&gpslimit=2&prop=description'],
    ['he.m.wikipedia.org prefixsearch', 'https://he.m.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query&generator=prefixsearch&gpssearch=%D7%AA%D7%9C&gpslimit=2&prop=description'],
    ['he.m.wikipedia.org parse (what articles use)', 'https://he.m.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=parse&page=%D7%93%D7%91%D7%9C%D7%99%D7%9F&prop=sections'],
    ['he.m.wikipedia.org opensearch', 'https://he.m.wikipedia.org/w/api.php?format=json&origin=*&action=opensearch&search=%D7%AA%D7%9C&limit=2'],
    ['translate GET', 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=he&tl=en&dt=t&q=%D7%A9%D7%9C%D7%95%D7%9D'],
    ['translate POST', 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=he&tl=en&dt=t', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}, body:'q=%D7%A9%D7%9C%D7%95%D7%9D'}],
    ['sefaria.org (control)', 'https://www.sefaria.org/api/calendars'],
  ];
  const table = el('table', {style:'border-collapse:collapse;font:.78rem/1.35 var(--f-ui);width:100%'});
  const info = el('pre', {style:'white-space:pre-wrap;font:.75rem/1.4 var(--f-ui);color:var(--muted)'}, `UA: ${navigator.userAgent}\nMOBILE=${MOBILE} online=${navigator.onLine} origin=${location.origin}`);
  main.replaceChildren(el('h1', {style:'font:600 1.3rem var(--f-ui)'}, 'Connectivity check'), info, el('div', {class:'tbl'}, table));
  for (const [name, url, init] of probes) {

  if (text.length < 2) return closeResults();
  results.replaceChildren(el('div', {class:'res note'}, 'Searching…'));
  try {
    let hits = [];
    if (HEB.test(text)) {
      const found = await searchWiki('he', text, full, 8);
      if (tok !== sToken) return;
      const ll = await langlinks('he', found.map(f => f.title), 'en');
      hits = found.map(f => ({ he:f.title, desc:f.desc, img:f.img, en:ll.get(f.title) }));
    } else {
      // English words: (1) English Wikipedia hits that have a Hebrew article, (2) the query translated into Hebrew and searched directly.
      const fails = [];
      const [enFound, heQ] = await Promise.all([
        searchWiki('en', text, full, 6).catch(e => { fails.push(e.message); return null; }),
        tr1(text, 'en', 'he').catch(()=>null) ]);
      if (!enFound && (!heQ || !HEB.test(heQ))) throw new Error(fails[0] || translateError || 'neither Wikipedia nor the translator answered');
      if (tok !== sToken) return;
      const [enLL, direct] = await Promise.all([
        enFound ? langlinks('en', enFound.map(f => f.title), 'he') : new Map(),
        (heQ && HEB.test(heQ)) ? searchWiki('he', heQ, full, 8).catch(()=>[]) : [] ]);
      if (tok !== sToken) return;
      const viaEn = (enFound||[]).filter(f => enLL.get(f.title)).map(f => ({ he:enLL.get(f.title), en:f.title, desc:f.desc, viaEn:true }));
      const dLL = await langlinks('he', direct.map(f => f.title), 'en');
      const directHits = direct.map(f => ({ he:f.title, desc:f.desc, img:f.img, en:dLL.get(f.title) }));
      const seen = new Set(); hits = [...viaEn, ...directHits].filter(h => !seen.has(h.he) && seen.add(h.he));
      if (heQ && HEB.test(heQ)) hits.heQ = heQ;
    }
    if (tok !== sToken) return;
    if (!hits.length) { results.replaceChildren(el('div', {class:'res note'}, full ? 'Nothing found.' : 'No title match — press Enter for a full-text search.')); return; }
    results.replaceChildren(...hits.map(h => {
      const row = el('div', {class:'res', role:'option', tabindex:0, onclick:()=>{ go(h.he); q.blur(); }},
        h.img ? el('img', {src:h.img, alt:''}) : el('div', {class:'noimg'}),
        el('div', {}, el('div', {class:'t'}, h.en || '…'), el('div', {class:'he'}, h.he), el('div', {class:'d'}, [h.desc, h.en ? null : 'no English article'].filter(Boolean).join(' · '))));
      row._h = h; return row; }),
      ...(hits.heQ ? [el('div', {class:'res note'}, `Searched Hebrew Wikipedia for “${hits.heQ}”`)] : []));
    // Fill in translated titles / descriptions for rows lacking an English title.
    const rows = [...results.querySelectorAll('.res[tabindex]')];
    const need = rows.filter(r => !r._h.en);
    translateMany(need.map(r => r._h.he), (i, v) => { if (v && tok === sToken) need[i].querySelector('.t').textContent = v; });
    const needD = rows.filter(r => r._h.desc && HEB.test(r._h.desc));
    translateMany(needD.map(r => r._h.desc), (i, v) => { if (v && tok === sToken) { const d = needD[i].querySelector('.d'); d.textContent = d.textContent.replace(needD[i]._h.desc, v); } });
  } catch (e) { if (tok === sToken) results.replaceChildren(el('div', {class:'res note'}, 'Search failed: ' + (e.name && e.name!=='Error' ? e.name+': ' : '') + e.message)); }
}

/* ---------- Random ---------- */
$('#rnd').onclick = async () => { try { const r = await api('he', {list:'random', rnnamespace:0, rnlimit:1}); go(r.query.random[0].title); } catch(e) { main.prepend(el("div", {class:"banner"}, e.message)); } };
$('#rndonly').onclick = async () => {
  const b = $('#rndonly'); b.disabled = true; b.textContent = 'Looking…';
  try {
    for (let tries = 0; tries < 4; tries++) {
      const r = await api('he', { generator:'random', grnnamespace:0, grnlimit:20, prop:'langlinks|info', lllang:'en' });
      const pick = (r.query?.pages||[]).filter(p => !p.langlinks?.length && p.length > 4000).sort((a,b)=>b.length-a.length)[0];
      if (pick) { go(pick.title); break; }
    }
  } catch(e) { main.prepend(el("div", {class:"banner"}, e.message)); } finally { b.disabled = false; b.textContent = 'Hebrew-only'; }
};

/* ---------- Article ---------- */
const BLOCK_SEL = 'p, h2, h3, h4, h5, li, dt, dd, th, td, caption, blockquote, figcaption, .thumbcaption';
async function loadArticle(title) {
  const tok = ++loadToken;
  prog.style.width = '0%';
  main.replaceChildren(el('div', {class:'ah'}, el('div', {class:'skel', style:'width:60%;height:2rem'}), el('div', {class:'skel', style:'width:35%'})), ...[90,100,95,80,100,70].map(w => el('div', {class:'skel', style:`width:${w}%`})));
  let parse, offlineAt = 0;
  try {
    const params = { action:'parse', page:title, prop:'text|sections|langlinks|displaytitle', disableeditsection:1, disabletoc:1, redirects:1 };
    const r = await api('he', params);
    if (r.error) throw new Error(r.error.info || r.error.code);
    parse = r.parse; offlineAt = r.__cachedAt || 0;
    if (!offlineAt && parse.title !== title) cachePut(apiKey('he', { ...params, page: parse.title }), r); // also under the canonical title, which is what Recents opens
  } catch (e) { if (tok===loadToken) main.replaceChildren(el('div', {class:'banner'}, `Could not load “${title}”: ${e.message}`)); return; }
  if (tok !== loadToken) return;
  const heTitle = parse.title;
  const enTitle = (parse.langlinks||[]).find(l => l.lang==='en')?.title || null;

  // --- build DOM ---
  const doc = new DOMParser().parseFromString(parse.text, 'text/html');
  const root = doc.body.firstElementChild || doc.body;
  root.querySelectorAll('style, script, link, .mw-editsection, #toc, .toc, .navbox, .mw-jump-link, .sistersitebox, .catlinks, .portal, .metadata, .ambox, .noprint, .mw-empty-elt, .printfooter, .mw-authority-control, .mw-hidden-catlinks, [style*="display:none"], [style*="display: none"]').forEach(n => n.remove());
  root.querySelectorAll('img').forEach(img => { const fix = s => s && s.replace(/(^|,\s*)\/\//g, '$1https://'); if (img.getAttribute('src')) img.src = fix(img.getAttribute('src')); if (img.getAttribute('srcset')) img.setAttribute('srcset', fix(img.getAttribute('srcset'))); img.loading = 'lazy'; img.removeAttribute('width'); img.removeAttribute('height'); });
  root.querySelectorAll('[style]').forEach(n => { n.style.removeProperty('float'); n.style.removeProperty('width'); n.style.removeProperty('font-size'); n.style.removeProperty('color'); n.style.removeProperty('background'); n.style.removeProperty('background-color'); });
  root.querySelectorAll('a').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (href.startsWith('/wiki/') && !/^\/wiki\/[^:]+:/.test(decodeURIComponent(href)) ) { a.dataset.t = decodeURIComponent(href.slice(6)).split('#')[0].replace(/_/g,' '); a.setAttribute('href', '#'+encodeURIComponent(href.slice(6).split('#')[0])); }
    else if (href.startsWith('#')) { /* footnote jump */ }
    else { if (href.startsWith('//')) a.href = 'https:'+href; else if (href.startsWith('/')) a.href = 'https://he.wikipedia.org'+href; a.target = '_blank'; a.rel = 'noopener'; }
  });
  // Tables scroll in their own box, except the infobox which gets its own treatment.
  root.querySelectorAll('table').forEach(t => { if (t.closest('.infobox') || t.classList.contains('infobox')) return; const w = doc.createElement('div'); w.className='tbl'; t.replaceWith(w); w.append(t); });
  // Reference list: keep in Hebrew, collapsed.
  root.querySelectorAll('ol.references, .reflist, .mw-references-wrap').forEach(r => { if (r.closest('details')) return; const d = doc.createElement('details'); d.className='collapse'; d.innerHTML = '<summary>References (Hebrew)</summary>'; r.replaceWith(d); d.append(r); });
  // List items that hold a sub-list: split off their own text so it can be translated separately.
  root.querySelectorAll('li, dd').forEach(li => { const sub = [...li.children].find(c => /^(UL|OL|DL)$/.test(c.tagName)); if (!sub) return; const own = doc.createElement('div'); own.className='li-own'; while (li.firstChild && li.firstChild !== sub) own.append(li.firstChild); if (own.textContent.trim()) li.prepend(own); });

  // --- choose translatable blocks ---
  const blocks = []; const srcs = [];
  for (const b of root.querySelectorAll(BLOCK_SEL + ', .li-own')) {
    if (b.closest('ol.references, .reflist, .mw-references-wrap, .mw-highlight, pre, code, .mwe-math-element')) continue;
    if (b.matches('li, dd') && b.querySelector('.li-own')) continue;
    if (b.querySelector(BLOCK_SEL)) continue; // not a leaf block
    const clone = b.cloneNode(true); clone.querySelectorAll('sup.reference, .noexcerpt, .mw-cite-backlink').forEach(n => n.remove());
    const text = clone.textContent.replace(/\s+/g,' ').trim();
    if (!HEB.test(text)) continue;
    b.classList.add('blk', 'pending');
    const he = doc.createElement('span'); he.className='t-he'; while (b.firstChild) he.append(b.firstChild);
    const en = doc.createElement('span'); en.className='t-en'; en.textContent = text;
    b.append(en, he); blocks.push(b); srcs.push(text);
  }

  // --- head ---
  const head = el('div', {class:'ah'});
  const h1 = el('h1', {}, enTitle || heTitle);
  const heH = el('p', {class:'he-title'}, heTitle);
  const cov = el('div', {class:'cov'});
  const meta = el('div', {class:'meta'});
  const cmp = el('section', {class:'cmp'});
  head.append(h1, heH, cov, meta);
  const modes = el('div', {class:'modes', role:'group', 'aria-label':'Language'});
  const modeBtns = { en:'English', both:'Both', he:'עברית' };
  Object.entries(modeBtns).forEach(([k,v]) => modes.append(el('button', {'aria-pressed': String(mode===k), onclick:()=>setMode(k)}, v)));
  const status = el('span', {class:'status'});
  const cmpBtn = el('button', {onclick:()=>{ cmp.classList.toggle('open'); if (cmp.classList.contains('open')) buildCompare(); }}, 'Compare sections');
  meta.append(modes, enTitle ? el('a', {href:`https://en.wikipedia.org/wiki/${encodeURIComponent(enTitle.replace(/ /g,'_'))}`, target:'_blank', rel:'noopener'}, 'English article ↗') : el('span', {class:'chip only'}, 'Hebrew-only · no English article'), el('a', {href:`https://he.wikipedia.org/wiki/${encodeURIComponent(heTitle.replace(/ /g,'_'))}`, target:'_blank', rel:'noopener'}, 'he.wikipedia ↗'), cmpBtn, status);
  const body = el('article', {class:'body', 'data-mode':mode, lang:'he'});
  body.append(...root.childNodes);
  const foot = el('div', {class:'foot'}, 'Text from Hebrew Wikipedia, CC BY-SA 4.0. English is machine translation; tap a paragraph to read the original.');
  main.replaceChildren(head, cmp, body, foot);
  if (offlineAt) main.insertBefore(el('div', {class:'banner ok'}, `Offline copy saved ${ago(offlineAt)}; Wikipedia could not be reached. Images need a connection.`), cmp);
  remember(heTitle, enTitle);
  idb.put('meta', { k: heTitle, en: enTitle, at: Date.now() });
  document.title = (enTitle || heTitle) + ' · Hebrew Wikipedia Reader';

  function setMode(k) { mode = k; store.set('mode', k); body.dataset.mode = k; modes.querySelectorAll('button').forEach((b,i) => b.setAttribute('aria-pressed', String(Object.keys(modeBtns)[i]===k))); }
  body.addEventListener('click', e => {
    const a = e.target.closest('a[data-t]'); if (a) { e.preventDefault(); go(a.dataset.t); return; }
    if (body.dataset.mode !== 'en') return;
    if (e.target.closest('a, details summary, img')) return;
    const b = e.target.closest('.blk'); if (b) b.classList.toggle('show');
  });

  // --- coverage: byte lengths of both articles ---
  (async () => {
    try {
      const [heI, enI] = await Promise.all([ api('he', {prop:'info', titles:heTitle}), enTitle ? api('en', {prop:'info', titles:enTitle}) : null ]);
      if (tok !== loadToken) return;
      const heLen = heI.query.pages[0].length, enLen = enI ? enI.query.pages[0].length : 0, max = Math.max(heLen, enLen, 1);
      const row = (lab, cls, n) => { const bar = el('div', {class:'bar '+cls}, el('i')); cov.append(el('span', {class:'lab'}, lab), bar, el('b', {}, fmtK(n)+' bytes')); requestAnimationFrame(() => bar.firstChild.style.width = (100*n/max)+'%'); };
      row('Hebrew', 'he', heLen); if (enTitle) row('English', 'en', enLen);
      cov._lens = {heLen, enLen};
    } catch {}
  })();

  // --- title translation ---
  if (!enTitle) tr1(heTitle).then(v => { if (v && tok===loadToken) { h1.textContent = v; remember(heTitle, v); document.title = v + ' · Hebrew Wikipedia Reader'; } });

  // --- translate blocks, visible first ---
  let done = 0; const total = srcs.length;
  status.textContent = total ? `Translating 0/${total}` : '';
  const order = blocks.map((b,i)=>i);
  const onEach = (i, v, err) => {
    const b = blocks[i]; b.classList.remove('pending');
    if (v) b.querySelector('.t-en').textContent = v; else { b.classList.add('untranslated'); b.querySelector('.t-en').textContent = b.querySelector('.t-he').textContent.trim(); }
    done++; if (tok===loadToken) { prog.style.width = (100*done/total)+'%'; status.textContent = done<total ? `Translating ${done}/${total}` + (translateVia && translateVia!=='Google' ? ' via '+translateVia : '') : (translateBroken ? 'Translation unavailable' : (translateVia && translateVia!=='Google' ? 'Translated via '+translateVia : '')); if (done===total) setTimeout(()=>{ if (tok===loadToken) prog.style.width='0%'; }, 600); }
  };
  if (total) {
    // First 40 blocks first (the lead), then the rest.
    const first = order.slice(0, 40), rest = order.slice(40);
    await translateMany(first.map(i=>srcs[i]), (j,v,e)=>onEach(first[j],v,e));
    if (tok !== loadToken) return;
    if (translateBroken && mode !== 'he') { setMode('he'); main.insertBefore(el('div', {class:'banner'}, 'Translation failed (' + translateError + '); showing the Hebrew text. The language buttons still work if it comes back.'), cmp); }
    await translateMany(rest.map(i=>srcs[i]), (j,v,e)=>onEach(rest[j],v,e));
  }

  // --- section comparison ---
  let cmpBuilt = false;
  async function buildCompare() {
    if (cmpBuilt) return; cmpBuilt = true;
    cmp.replaceChildren(el('h2', {}, 'Section by section'), el('p', {class:'empty'}, 'Loading…'));
    try {
      const heLen = cov._lens?.heLen ?? (await api('he', {prop:'info', titles:heTitle})).query.pages[0].length;
      const heS = sizes(parse.sections, heLen);
      let enS = null, enLen = 0;
      if (enTitle) { const [p, i] = await Promise.all([ api('en', {action:'parse', page:enTitle, prop:'sections', redirects:1}), api('en', {prop:'info', titles:enTitle}) ]); enLen = i.query.pages[0].length; enS = sizes(p.parse.sections, enLen); }
      const max = Math.max(...heS.map(s=>s.bytes), ...(enS||[]).map(s=>s.bytes), 1);
      const col = (cls, label, len, list) => el('div', {class:cls}, el('h3', {}, label, el('span', {}, fmtK(len)+' bytes · '+list.length+' sections')), el('ol', {}, ...list.map(s => el('li', {class:s.level>2?'l3':''}, el('span', {class:'n', title:s.line}, s.line, s.he ? el('small', {}, s.he) : null), el('span', {class:'b'}, el('i', {style:`width:${100*s.bytes/max}%`}))))));
      const heCol = col('he', 'Hebrew', heLen, heS);
      cmp.replaceChildren(el('h2', {}, 'Section by section'), el('div', {class:'cols'}, heCol, enS ? col('en', 'English', enLen, enS) : el('div', {class:'en'}, el('h3', {}, 'English'), el('p', {class:'empty'}, 'No English article is linked to this one.'))));
      // translate Hebrew section names in the left column
      const items = [...heCol.querySelectorAll('li .n')];
      translateMany(heS.map(s=>s.line), (i,v) => { if (v && v !== heS[i].line) { items[i].firstChild.textContent = v; items[i].append(el('small', {}, heS[i].line)); } });
    } catch (e) { cmp.replaceChildren(el('h2', {}, 'Section by section'), el('p', {class:'empty'}, 'Could not load sections: '+e.message)); }
  }
  function sizes(sections, total) {
    const s = (sections||[]).filter(x => x.byteoffset != null).map(x => ({ line: x.line.replace(/<[^>]+>/g,''), level: +x.toclevel + 1, off: x.byteoffset }));
    const out = [{ line: '(lead)', level: 2, off: 0 }, ...s];
    for (let i = 0; i < out.length; i++) { const next = out.slice(i+1).find(x => x.level <= out[i].level); out[i].bytes = Math.max(0, (next ? next.off : total) - out[i].off); }
    return out.filter(x => x.level <= 3);
  }
}

route();
})();
</script>
</body>
</html>
